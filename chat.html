<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>专属聊天房间</title>
    <style>
        body{max-width:800px;margin:20px auto;font-family:微软雅黑;}
        #chatBox{height:400px;border:1px solid #ccc;padding:10px;overflow-y:auto;margin-bottom:15px;}
        .msg{margin:6px 0;}
        .self{text-align:right;color:#0066ff;}
        .other{text-align:left;color:#222;}
    </style>
</head>
<body>
    <h2>私人聊天室（仅你和好友）</h2>
    <div id="chatBox"></div>
    <input id="nick" placeholder="输入你的昵称" value="我">
    <br><br>
    <input id="msg" placeholder="输入消息" style="width:70%;padding:8px;">
    <button onclick="sendMsg()" style="padding:8px 20px;">发送</button>
<script>
   const WS_LINK = "wss://chat.justinni20101221.workers.dev";
let socket;
const chatBox = document.getElementById("chatBox");
const nickInput = document.getElementById("nick");
const msgInput = document.getElementById("msg");

function connectSocket() {
  socket = new WebSocket(WS_LINK);
  socket.onmessage = (res) => {
    const item = JSON.parse(res.data);
    const div = document.createElement("div");
    div.className = item.nick === nickInput.value ? "msg self" : "msg other";
    div.innerText = `${item.nick}：${item.text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  };
  socket.onclose = () => setTimeout(connectSocket, 2000);
}

function sendMsg() {
  const name = nickInput.value.trim();
  const text = msgInput.value.trim();
  if (!text || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({nick: name, text: text}));
  msgInput.value = "";
}

msgInput.onkeydown = (e) => {
  if (e.key === "Enter") sendMsg();
};

connectSocket();
    </script>
</body>
</html>
