<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>专属聊天房间</title>
    <style>
        body{max-width:800px;margin:20px auto;font-family:微软雅黑;}
        #chatBox{height:400px;border:1px solid #ccc;padding:10px;overflow-y:auto;margin-bottom:15px;}
        .msg{margin:6px 0;}
        .self{text-align:right;color:#0066ff;}
        .other{text-align:left;color:#222;}
    </style>
</head>
<body>
    <h2>私人聊天室（仅你和好友）</h2>
    <div id="chatBox"></div>
    <input id="nick" placeholder="输入你的昵称" value="我">
    <br><br>
    <input id="msg" placeholder="输入消息" style="width:70%;padding:8px;">
    <button onclick="sendMsg()" style="padding:8px 20px;">发送</button>

    <script>
        // 后面替换成你Worker的地址
        const API_URL = "https://chat.justinni20101221.workers.dev";
        const chatBox = document.getElementById("chatBox");

        async function sendMsg(){
            const nick = document.getElementById("nick").value;
            const text = document.getElementById("msg").value.trim();
            if(!text) return;
            await fetch(API_URL,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({nick,text})
            })
            document.getElementById("msg").value = "";
            loadMsg();
        }

        async function loadMsg(){
            const res = await fetch(API_URL);
            const list = await res.json();
            chatBox.innerHTML = "";
            list.forEach(item=>{
                const div = document.createElement("div");
                div.className = item.nick === document.getElementById("nick").value ? "msg self" : "msg other";
                div.innerText = `${item.nick}：${item.text}`;
                chatBox.appendChild(div);
            })
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        setInterval(loadMsg,3000);
        loadMsg();
    </script>
</body>
</html>
